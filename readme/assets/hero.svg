  <rect x="72" y="152" width="128" height="8" rx="4" fill="#FFD43B"/>
  <g id="step-create">
    <rect x="72" y="196" width="18" height="18" rx="4" fill="#FFD43B"/>
    <text x="108" y="214" fill="#12324A" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="52" font-weight="700">创建</text>
  </g>
